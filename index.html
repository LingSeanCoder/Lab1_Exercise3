<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resilient Event Hub — Nguyễn Đình Sang</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/countdown.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/form.css">
  <script defer src="js/countdown.js"></script>
  <script defer src="js/form-state.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>Resilient Event Hub</h1>
    <p>Join our launch event.</p>
  </header>

  <main id="main">
    <section aria-labelledby="countdown-heading">
      <h2 id="countdown-heading">Event starts in</h2>
      <div class="countdown" data-target="2027-01-01T00:00:00Z" role="timer" aria-live="polite">
        <div class="countdown__unit">
          <span class="countdown__value" data-unit="days">00</span>
          <span class="countdown__label">Days</span>
        </div>
        <div class="countdown__unit">
          <span class="countdown__value" data-unit="hours">00</span>
          <span class="countdown__label">Hours</span>
        </div>
        <div class="countdown__unit">
          <span class="countdown__value" data-unit="minutes">00</span>
          <span class="countdown__label">Minutes</span>
        </div>
        <div class="countdown__unit">
          <span class="countdown__value" data-unit="seconds">00</span>
          <span class="countdown__label">Seconds</span>
        </div>
      </div>
    </section>

    <section aria-labelledby="register-heading">
      <h2 id="register-heading">Register</h2>
      <form id="register-form" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required minlength="2" autocomplete="name">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <button type="submit" id="submit-btn">Register</button>
      </form>
      <p role="status" aria-live="polite" id="form-status"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Nguyễn Đình Sang</p>
  </footer>
</body>
</html>
